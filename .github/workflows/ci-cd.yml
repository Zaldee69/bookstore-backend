name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: '20.x'
  DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/book-backend

jobs:
  # Job 1: Lint and Test (using Supabase cloud database)
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript compilation
        run: npm run build

      - name: Check for linting errors
        run: echo "Linting passed (add eslint if needed)"

      - name: Run database migrations (test)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npx prisma migrate deploy
          else
            echo "DATABASE_URL_TEST not configured, skipping migrations"
          fi

      - name: Run tests (if available)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_TEST }}
          JWT_SECRET: test-secret
          PAYMENT_CALLBACK_SECRET: test-payment-secret
        run: echo "Tests passed (add tests if needed)"

  # Job 2: Build and Push Docker Image to Docker Hub
  build-and-push:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    needs: lint-and-test
    environment: production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image details
        run: |
          echo "Docker image pushed successfully!"
          echo "Image: ${{ env.DOCKER_IMAGE }}"
          echo "Tags: latest, ${{ github.sha }}"

  # Job 3: Deploy to Production (VPS via SSH)
  deploy-production:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup deployment directory on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            mkdir -p /opt/book-backend
            echo "Deployment directory ready"

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: "docker-compose.yml"
          target: "/opt/book-backend"

      - name: Create .env file on VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/book-backend
            if [ ! -f .env ]; then
              cat > .env << EOF
            NODE_ENV=production
            PORT=3000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=3600
            PAYMENT_CALLBACK_SECRET=${{ secrets.PAYMENT_CALLBACK_SECRET }}
            RATE_LIMIT_WINDOW_MS=900000
            RATE_LIMIT_MAX=100
            RATE_LIMIT_SENSITIVE_WINDOW_MS=300000
            RATE_LIMIT_SENSITIVE_MAX=5
            EOF
              echo ".env file created"
            else
              echo ".env file already exists, skipping..."
            fi

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /opt/book-backend
            docker pull ${{ secrets.DOCKER_USERNAME }}/book-backend:latest
            docker-compose down
            docker-compose up -d
            docker image prune -f
            sleep 10
            curl -f http://localhost:3000/health || exit 1
            echo "Deployment successful!"

      - name: Deployment notification
        run: |
          echo "Deployed to production successfully!"
          echo "Image: ${{ env.DOCKER_IMAGE }}:latest"
          echo "Server: ${{ secrets.VPS_HOST }}"

